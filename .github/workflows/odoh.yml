name: ODoH validation

on:
  push:
    branches: [main]
    paths:
      - "ODoH/**"
      - ".github/workflows/odoh.yml"
  pull_request:
    paths:
      - "ODoH/**"
      - ".github/workflows/odoh.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odoh-${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ODoH
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: ODoH/go.sum

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Format Go sources
        run: gofmt -w Proxy/*.go Target/*.go

      - name: Static analysis
        run: go vet ./...

      - name: Build Proxy and Target
        run: |
          go build -trimpath -o /tmp/odoh-proxy-ci ./Proxy
          go build -trimpath -o /tmp/odoh-target-ci ./Target

      - name: Run protocol and regression tests
        env:
          GODEBUG: "httpmuxgo121=0"
          # Keep race-enabled tests predictable on small/shared GitHub runners.
          GOMAXPROCS: "2"
        run: go test -race -count=1 -v -timeout=3m ./...

      - name: Fuzz malformed ODoH messages
        env:
          # Bound fuzz worker count to avoid exhausting runner process limits.
          GOMAXPROCS: "2"
        run: go test ./Target -run='^$' -fuzz=FuzzTargetMalformedODoH -fuzztime=10s -parallel=2 -timeout=1m

      - name: Build Proxy Docker image
        run: docker build --pull -f Proxy/Dockerfile -t sockshttpgate-odoh-proxy:ci .

      - name: Build Target Docker image
        run: docker build --pull -f Target/Dockerfile -t sockshttpgate-odoh-target:ci .

name: ODoH full validation

on:
  push:
    paths:
      - "ODoH/**"
      - ".github/workflows/odoh.yml"
  pull_request:
    paths:
      - "ODoH/**"
      - ".github/workflows/odoh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ODoH
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: ODoH/go.mod
      - name: Resolve and verify modules
        run: go mod tidy
      - name: Check Go test formatting
        run: |
          files="$(gofmt -l Proxy/main_test.go Proxy/security_test.go Target/main_test.go integration/e2e_test.go)"
          if [ -n "$files" ]; then
            echo "Go test files need gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./...
      - name: Build Proxy and Target
        run: |
          go build -trimpath -o ../.odoh-proxy-ci ./Proxy
          go build -trimpath -o ../.odoh-target-ci ./Target
      - name: Run all tests with race detector
        env:
          GODEBUG: "httpmuxgo121=0"
        run: go test -race -count=1 -v ./...
      - name: Fuzz malformed ODoH messages
        run: go test ./Target -run=^$ -fuzz=FuzzTargetMalformedODoH -fuzztime=10s
      - name: Build Proxy Docker image
        run: docker build --pull -f Proxy/Dockerfile -t sockshttpgate-odoh-proxy:ci .
      - name: Build Target Docker image
        run: docker build --pull -f Target/Dockerfile -t sockshttpgate-odoh-target:ci .

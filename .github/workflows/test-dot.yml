name: Test DoT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DoT/**"
      - ".github/workflows/test-dot.yml"
  pull_request:
    paths:
      - "DoT/**"
      - ".github/workflows/test-dot.yml"

permissions:
  contents: read

concurrency:
  group: dot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-dot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DoT
    env:
      ADMIN_USER: ci
      ADMIN_PASSWORD: ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: DoT/go.mod
          cache: true
          cache-dependency-path: DoT/go.sum

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Format Go sources
        run: gofmt -w *.go

      - name: Unit tests
        run: go test -count=1 -v ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/sockshttpgate-dot .

      - name: Build Docker image
        run: docker build --pull -t sockshttpgate-dot:ci .

      - name: Smoke test DoT and dashboard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dot-test
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/dot-test/key.pem \
            -out /tmp/dot-test/cert.pem \
            -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

          ADMIN_USER="${ADMIN_USER}" \
          ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
          DOT_ADDR=127.0.0.1:8853 \
          DASHBOARD_ADDR=127.0.0.1:8080 \
          TLS_CERT_FILE=/tmp/dot-test/cert.pem \
          TLS_KEY_FILE=/tmp/dot-test/key.pem \
          UPSTREAM_DOT=1.1.1.1:853 \
          UPSTREAM_TLS_NAME=cloudflare-dns.com \
          /tmp/sockshttpgate-dot > /tmp/dot-test/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          # ---- 1. Login → save session cookie ----
          login_ok=0
          for attempt in $(seq 1 30); do
            login_code=$(curl -sS \
              -c /tmp/dot-test/cookies.txt \
              -o /tmp/dot-test/login.json \
              -w "%{http_code}" \
              -X POST \
              -H 'Content-Type: application/json' \
              -d "{\"username\":\"${ADMIN_USER}\",\"password\":\"${ADMIN_PASSWORD}\"}" \
              http://127.0.0.1:8080/api/login || true)
            echo "login attempt=$attempt http=$login_code"
            if [[ "$login_code" == "200" ]]; then
              login_ok=1
              break
            fi
            sleep 1
          done
          if [[ "$login_ok" != 1 ]]; then
            echo "--- server.log ---"; cat /tmp/dot-test/server.log
            echo "--- login.json ---"; cat /tmp/dot-test/login.json 2>/dev/null || true
            echo "Login did not succeed" >&2; exit 1
          fi

          # ---- 2. Poll /api/stats with session cookie ----
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS \
              -b /tmp/dot-test/cookies.txt \
              -o /tmp/dot-test/stats.json \
              -w "%{http_code}" \
              http://127.0.0.1:8080/api/stats || true)
            echo "stats attempt=$attempt http=$code"
            if [[ "$code" == "200" ]]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo "--- server.log ---"; cat /tmp/dot-test/server.log
            echo "--- stats.json ---"; cat /tmp/dot-test/stats.json 2>/dev/null || true
            echo "Dashboard did not become ready" >&2; exit 1
          fi

          echo "--- stats.json ---"
          cat /tmp/dot-test/stats.json
          python3 -c "import json; json.load(open('/tmp/dot-test/stats.json'))" \
            || { echo "stats.json is not valid JSON" >&2; exit 1; }

          # ---- 3. Real DoT query (self-signed cert → InsecureSkipVerify) ----
          cat >/tmp/dot-test/client.go <<'EOF'
          package main

          import (
            "crypto/tls"
            "fmt"
            "os"
            "time"

            "github.com/miekg/dns"
          )

          func main() {
            client := &dns.Client{
              Net: "tcp-tls",
              TLSConfig: &tls.Config{
                ServerName:         "localhost",
                InsecureSkipVerify: true, // Self-signed cert, local CI only
              },
              Timeout: 8 * time.Second,
            }
            query := new(dns.Msg)
            query.SetQuestion("example.com.", dns.TypeA)
            response, _, err := client.Exchange(query, "127.0.0.1:8853")
            if err != nil {
              fmt.Fprintln(os.Stderr, "DoT query failed:", err)
              os.Exit(1)
            }
            if response == nil || response.Rcode != dns.RcodeSuccess {
              fmt.Fprintf(os.Stderr, "unexpected DNS response: %#v\n", response)
              os.Exit(1)
            }
            fmt.Printf("DoT OK: rcode=%s answers=%d\n",
              dns.RcodeToString[response.Rcode], len(response.Answer))
          }
          EOF
          go run /tmp/dot-test/client.go

          # ---- 4. Verify stats updated after query ----
          echo "--- stats after query ---"
          curl -sS -b /tmp/dot-test/cookies.txt \
            http://127.0.0.1:8080/api/stats || true

          # ---- 5. Test logout ----
          echo ""
          echo "--- logout ---"
          curl -sS -b /tmp/dot-test/cookies.txt -X POST \
            http://127.0.0.1:8080/api/logout || true

          echo ""
          echo "--- server.log ---"
          cat /tmp/dot-test/server.log
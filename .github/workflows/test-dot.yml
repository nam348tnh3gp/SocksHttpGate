name: Test DoT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DoT/**"
      - ".github/workflows/test-dot.yml"
  pull_request:
    paths:
      - "DoT/**"
      - ".github/workflows/test-dot.yml"

permissions:
  contents: read

concurrency:
  group: dot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-dot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DoT
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: DoT/go.mod
          cache: true
          cache-dependency-path: DoT/go.sum

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l *.go)"
          if [[ -n "$files" ]]; then
            echo "These Go files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Unit tests
        run: go test -count=1 -v ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/sockshttpgate-dot .

      - name: Build Docker image
        run: docker build --pull -t sockshttpgate-dot:ci .

      - name: Smoke test DoT and dashboard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dot-test
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/dot-test/key.pem \
            -out /tmp/dot-test/cert.pem \
            -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

          DOT_ADDR=127.0.0.1:8853 \
          DASHBOARD_ADDR=127.0.0.1:8080 \
          TLS_CERT_FILE=/tmp/dot-test/cert.pem \
          TLS_KEY_FILE=/tmp/dot-test/key.pem \
          /tmp/sockshttpgate-dot > /tmp/dot-test/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/stats >/tmp/dot-test/stats.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat /tmp/dot-test/server.log
            echo "Dashboard did not become ready" >&2
            exit 1
          fi
          grep -q '"ready":true' /tmp/dot-test/stats.json

          cat >/tmp/dot-test/client.go <<'EOF'
          package main

          import (
            "crypto/tls"
            "fmt"
            "os"
            "time"

            "github.com/miekg/dns"
          )

          func main() {
            client := &dns.Client{
              Net: "tcp-tls",
              TLSConfig: &tls.Config{
                ServerName: "localhost",
                InsecureSkipVerify: true, // Self-signed certificate is only for this local CI test.
              },
              Timeout: 8 * time.Second,
            }
            query := new(dns.Msg)
            query.SetQuestion("example.com.", dns.TypeA)
            response, _, err := client.Exchange(query, "127.0.0.1:8853")
            if err != nil {
              fmt.Fprintln(os.Stderr, "DoT query failed:", err)
              os.Exit(1)
            }
            if response == nil || response.Rcode != dns.RcodeSuccess {
              fmt.Fprintf(os.Stderr, "unexpected DNS response: %#v\n", response)
              os.Exit(1)
            }
            fmt.Printf("DoT OK: rcode=%s answers=%d\n", dns.RcodeToString[response.Rcode], len(response.Answer))
          }
          EOF

          # The temporary client is run from this module so it can resolve
          # github.com/miekg/dns from DoT/go.mod.
          go run /tmp/dot-test/client.go
          cat /tmp/dot-test/stats.json
          cat /tmp/dot-test/server.log
